<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabDeck Desktop Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img class="logo" src="tabdeck-mark.svg" alt="TabDeck">
      <div class="header-copy"><span class="eyebrow">DESKTOP COMPANION</span><h1>Session bridge</h1><p>Preserve native groups while sending tabs to Android.</p></div>
      <button id="refresh" class="icon-button" aria-label="Refresh preview" title="Refresh preview">↻</button>
    </header>
    <section class="stats">
      <article><strong id="tabCount">—</strong><span>Tabs</span></article>
      <article><strong id="groupCount">—</strong><span>Groups</span></article>
      <article><strong id="duplicateCount">—</strong><span>Duplicates</span></article>
    </section>
    <section class="panel">
      <div class="two-column">
        <label>Source browser
          <select id="browser"><option>Chrome</option><option>Chrome Beta</option><option>Chrome Dev</option><option>Chrome Canary</option><option>Brave</option><option>Brave Beta</option><option>Opera</option><option>Opera Beta</option><option>Microsoft Edge</option><option>Edge Beta</option><option>Vivaldi</option></select>
        </label>
        <label>Device label<input id="deviceName" maxlength="120" placeholder="Work laptop"></label>
      </div>
    </section>
    <details class="panel connection">
      <summary>Android bridge connection</summary>
      <label>Phone endpoint<input id="endpoint" type="url" spellcheck="false" placeholder="http://127.0.0.1:48721/api/v3/import"></label>
      <label>Bridge token<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
      <p>TabDeck accepts loopback only. Use an explicit ADB port forward to 127.0.0.1:48721, and stop the bridge after use.</p>
    </details>
    <button id="send" class="primary-button">Send tabs + groups to Android</button>
    <p id="status" role="status" aria-live="polite">Reading browser session…</p>
  </main>
  <script src="bridge-runtime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
