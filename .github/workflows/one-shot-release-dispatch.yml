name: One-shot v1.0.0 release dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-release-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v1.0.0
