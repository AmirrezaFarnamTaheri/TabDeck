name: Apply v1.2 automation and recovery

on:
  push:
    branches:
      - codex/automation-recovery-v1.2
    paths:
      - .tabdeck-v1.2.ready

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify and apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          echo "c10f4449f2e2419a702c710705995127f9684736419581f4204dc6a76a454c8c  .tabdeck-v1.2-chunks/part-00" | sha256sum -c -
          echo "a055b20370ab69f0fbd8e58a6cdd8e7d0a80874185e98a2d255d1dba634fc52c  .tabdeck-v1.2-chunks/part-01" | sha256sum -c -
          echo "7c010436339a832853d5d26a346c0c86ac2dbc389d8a3aa5e33ebb9ea10925a8  .tabdeck-v1.2-chunks/part-02" | sha256sum -c -
          echo "5b603065d65d851bc5435c873729c54a34ffdd5648a8960dc5cf56b8bf463ce9  .tabdeck-v1.2-chunks/part-03" | sha256sum -c -
          echo "8b76d031f344dfa2687d104e2c1c9f5faefeca87377a958f22baa94da5105655  .tabdeck-v1.2-chunks/part-04" | sha256sum -c -
          echo "323eac94f293af206dff8d78a4690e9e193bcf9be45301429dc928fad26dbc9a  .tabdeck-v1.2-chunks/part-05" | sha256sum -c -
          cat .tabdeck-v1.2-chunks/part-* > "${RUNNER_TEMP}/tabdeck-v1.2.patch.gz.b64"
          echo "cf261cd0991e57ea3a133e670ef9691b8f6c1c49e61017d9be7fc205917f467d  ${RUNNER_TEMP}/tabdeck-v1.2.patch.gz.b64" | sha256sum -c -
          base64 --decode "${RUNNER_TEMP}/tabdeck-v1.2.patch.gz.b64" | gzip --decompress > "${RUNNER_TEMP}/tabdeck-v1.2.patch"
          echo "c6f16307572e4c7f74f2db4cc21addbd7c9865337162a63e664d4ef27f581260  ${RUNNER_TEMP}/tabdeck-v1.2.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/tabdeck-v1.2.patch"
          git apply "${RUNNER_TEMP}/tabdeck-v1.2.patch"

      - name: Run project verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/check_version.py
          bash tools/run_core_checks.sh
          python3 tools/validate_project.py --report build-validation-report.txt
          python3 tools/validate_guided_utility.py
          python3 tools/validate_simple_release.py
          python3 tools/validate_connector_dom.py
          python3 tools/performance_budget.py --validate-config
          ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug assembleCommunityRelease

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .tabdeck-v1.2.patch.gz.b64 .tabdeck-v1.2-chunks .tabdeck-v1.2.ready .github/workflows/apply-v1.2-automation.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m "Implement v1.2 automation and recovery"
          git push origin HEAD:codex/automation-recovery-v1.2
