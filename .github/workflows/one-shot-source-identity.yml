name: One-shot source identity implementation

on:
  push:
    branches:
      - codex/deep-improvement-plan
    paths:
      - .github/workflows/one-shot-source-identity.yml

permissions:
  contents: write

concurrency:
  group: source-identity-implementation
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/deep-improvement-plan
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Establish failing identity regression check
        shell: bash
        env:
          RED_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "${RED_PATCH_B64}" | base64 --decode > /tmp/red_identity.py
          python3 /tmp/red_identity.py
          if bash tools/run_core_checks.sh > /tmp/red-signal.log 2>&1; then
            cat /tmp/red-signal.log
            echo "Expected the source-identity regression check to fail before implementation."
            exit 1
          fi
          cat /tmp/red-signal.log
          grep -q "SourceIdentity.kt" /tmp/red-signal.log

      - name: Implement session-scoped source identity
        shell: bash
        env:
          APPLY_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "${APPLY_PATCH_B64}" | base64 --decode > /tmp/apply_identity.py
          python3 /tmp/apply_identity.py

      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          bash tools/run_core_checks.sh
          python3 tools/check_version.py
          python3 tools/validate_project.py --report build-validation-report.txt
          node --check extensions/chromium-desktop/popup.js
          node --check extensions/firefox-android/popup.js
          ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TabDeck Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/tabdeck/app/engine/SourceIdentity.kt app/src/main/java/com/tabdeck/app/bridge/BridgePayloadParser.kt app/src/test/java/com/tabdeck/app/engine/SourceIdentityTest.kt extensions/chromium-desktop/popup.js extensions/firefox-android/popup.js tools/CoreChecks.kt tools/run_core_checks.sh tools/validate_project.py docs/BRIDGE_PROTOCOL.md docs/ARCHITECTURE.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No implementation changes were produced."; exit 1; }
          git commit -m "Scope browser tab identity to source session"
          git push origin HEAD:codex/deep-improvement-plan

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: source-identity-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/red-signal.log
            build-validation-report.txt
            app/build/reports/**
            app/build/test-results/**
