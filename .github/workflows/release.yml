name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  release:
    name: Build, verify, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag points at checked-out commit
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "${TAG}")" = "$(git rev-parse HEAD)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses >/dev/null || true
          sdkmanager platform-tools "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Verify synchronized release version
        run: python3 tools/check_version.py --tag "${{ steps.release_tag.outputs.tag }}"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TABDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TABDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TABDECK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TABDECK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?missing}"
          : "${KEYSTORE_PASSWORD:?missing}"
          : "${KEY_ALIAS:?missing}"
          : "${KEY_PASSWORD:?missing}"

      - name: Run validation
        run: |
          bash tools/run_core_checks.sh
          python3 tools/validate_project.py --report build-validation-report.txt

      - name: Build signed Android release
        run: ./gradlew --no-daemon --stacktrace clean test lintRelease assembleRelease bundleRelease

      - name: Package and publish
        run: |
          python3 tools/package_release.py --require-android-artifacts --output-dir dist
          cd dist
          sha256sum -c TabDeck-v*-SHA256.txt
          gh release create "${{ steps.release_tag.outputs.tag }}" * --verify-tag --title "TabDeck ${{ steps.release_tag.outputs.tag }}" --notes-file ../docs/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
