name: Apply final PR 13 review fixes

on:
  push:
    branches:
      - codex/guided-utility-v1.1
    paths:
      - .github/pr13-final-review-fixes.patch.b64
      - .github/workflows/pr13-final-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: pr13-final-review-fixes
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/guided-utility-v1.1
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Apply verified review patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/pr13-final-review-fixes.patch.b64 > /tmp/pr13-final-review-fixes.patch
          git apply --check /tmp/pr13-final-review-fixes.patch
          git apply /tmp/pr13-final-review-fixes.patch
          git diff --check

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_guided_utility.py
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.tabdeck.app.data.local.TabQueryBuilderTest

      - name: Publish clean review-fix commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/pr13-final-review-fixes.patch.b64
          rm .github/workflows/pr13-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address remaining PR review feedback"
          git push origin HEAD:codex/guided-utility-v1.1
