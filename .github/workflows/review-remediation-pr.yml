name: Publish validated non-workflow remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/review-remediation-pr.yml

permissions:
  contents: write

concurrency:
  group: publish-review-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'codex/deep-improvement-plan'
    name: Verify and publish non-workflow fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch without ambient credentials
        uses: actions/checkout@v6
        with:
          ref: codex/deep-improvement-plan
          fetch-depth: 0
          persist-credentials: false

      - name: Apply asserted remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/review-remediation.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY\n", start)
          program = dedent(workflow[start:end])
          target = Path('/tmp/tabdeck-review-remediation.py')
          target.write_text(program, encoding='utf-8')
          compile(program, str(target), 'exec')
          PY
          python3 /tmp/tabdeck-review-remediation.py

      - name: Verify deterministic and cross-component contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync_extension_runtime.py
          python3 tools/check_version.py
          python3 tools/validate_project.py --report build-validation-report.txt
          python3 tools/performance_budget.py --validate-config
          pwsh -NoLogo -NoProfile -File ./desktop-link/Test-TabDeckLink.ps1
          node --check extensions/shared/bridge-runtime.js
          node --check extensions/chromium-desktop/popup.js
          node --check extensions/firefox-android/popup.js

      - name: Commit and push verified non-workflow fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/release.yml \
            .github/workflows/review-remediation.yml \
            .github/workflows/review-remediation-pr.yml
          git rm -f --ignore-unmatch tools/__pycache__/versioning.cpython-312.pyc
          git add -A
          git diff --cached -- .github/workflows | grep -q . && {
            echo 'Refusing to push workflow changes with the Actions token.' >&2
            exit 1
          } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Address all non-workflow PR review feedback'
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin HEAD:codex/deep-improvement-plan
