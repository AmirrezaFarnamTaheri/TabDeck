name: Package validated PR review remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/review-remediation-pr.yml

permissions:
  contents: read

concurrency:
  group: package-review-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event.pull_request.head.ref == 'codex/deep-improvement-plan'
    name: Build validated remediation snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: codex/deep-improvement-plan
          fetch-depth: 0
          persist-credentials: false

      - name: Apply asserted remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/review-remediation.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY\n", start)
          program = dedent(workflow[start:end])
          target = Path('/tmp/tabdeck-review-remediation.py')
          target.write_text(program, encoding='utf-8')
          compile(program, str(target), 'exec')
          PY
          python3 /tmp/tabdeck-review-remediation.py

      - name: Verify deterministic and cross-component contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync_extension_runtime.py
          python3 tools/check_version.py
          python3 tools/validate_project.py --report build-validation-report.txt
          python3 tools/performance_budget.py --validate-config
          pwsh -NoLogo -NoProfile -File ./desktop-link/Test-TabDeckLink.ps1
          node --check extensions/shared/bridge-runtime.js
          node --check extensions/chromium-desktop/popup.js
          node --check extensions/firefox-android/popup.js

      - name: Package exact final source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/review-remediation.yml
          rm -f .github/workflows/review-remediation-pr.yml
          rm -f tools/__pycache__/versioning.cpython-312.pyc
          tar --exclude=.git -czf /tmp/tabdeck-remediated-source.tar.gz .
          sha256sum /tmp/tabdeck-remediated-source.tar.gz > /tmp/tabdeck-remediated-source.sha256

      - name: Upload validated source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: tabdeck-review-remediation-${{ github.sha }}
          path: |
            /tmp/tabdeck-remediated-source.tar.gz
            /tmp/tabdeck-remediated-source.sha256
          if-no-files-found: error
          retention-days: 1
