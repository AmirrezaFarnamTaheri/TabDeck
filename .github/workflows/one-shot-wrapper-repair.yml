name: One-shot Gradle wrapper repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-wrapper-repair.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"

      - name: Generate and verify official wrapper JAR in isolation
        shell: bash
        run: |
          set -euo pipefail
          TEMP_PROJECT="$(mktemp -d)"
          printf '%s\n' 'rootProject.name = "wrapper-bootstrap"' > "${TEMP_PROJECT}/settings.gradle"
          (
            cd "${TEMP_PROJECT}"
            gradle wrapper --gradle-version 9.6.1 --distribution-type bin
          )
          SOURCE_JAR="${TEMP_PROJECT}/gradle/wrapper/gradle-wrapper.jar"
          test -s "${SOURCE_JAR}"
          jar tf "${SOURCE_JAR}" | grep -q '^org/gradle/wrapper/GradleWrapperMain.class$'
          mkdir -p gradle/wrapper
          cp "${SOURCE_JAR}" gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Strengthen wrapper validation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_project.py")
          text = path.read_text(encoding="utf-8")
          marker = 'def validate_build_coordinates() -> None:\n'
          check = '''def validate_gradle_wrapper_files() -> None:\n    wrapper_jar = ROOT / "gradle/wrapper/gradle-wrapper.jar"\n    if not wrapper_jar.is_file() or wrapper_jar.stat().st_size < 10_000:\n        fail("Gradle wrapper JAR is missing or implausibly small")\n    else:\n        ok(f"Validated committed Gradle wrapper JAR ({wrapper_jar.stat().st_size} bytes)")\n\n\n'''
          if "def validate_gradle_wrapper_files()" not in text:
              if marker not in text:
                  raise SystemExit("Validator insertion marker not found")
              text = text.replace(marker, check + marker, 1)
          call_marker = "    validate_build_coordinates()\n"
          if "    validate_gradle_wrapper_files()\n" not in text:
              if call_marker not in text:
                  raise SystemExit("Validator call marker not found")
              text = text.replace(call_marker, "    validate_gradle_wrapper_files()\n" + call_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/one-shot-wrapper-repair.yml

      - name: Validate repaired wrapper state
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          python3 tools/validate_project.py --report build-validation-report.txt

      - name: Commit wrapper repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified Gradle 9.6.1 wrapper bootstrap"
          git push origin HEAD:main

      - name: Dispatch clean CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
