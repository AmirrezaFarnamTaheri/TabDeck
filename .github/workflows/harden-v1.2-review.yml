name: Harden v1.2 review findings

on:
  push:
    branches:
      - codex/automation-recovery-v1.2
    paths:
      - .github/workflows/harden-v1.2-review.yml

permissions:
  contents: write

concurrency:
  group: harden-v1.2-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch without persisted credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ -z "${SDK_ROOT}" || ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "${SDKMANAGER}" && test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Apply review hardening fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          widget = Path('app/src/main/java/com/tabdeck/app/widget/TabDeckWidget.kt')
          text = widget.read_text(encoding='utf-8')
          if 'import kotlinx.coroutines.CancellationException\n' not in text:
              text = replace_once(
                  text,
                  'import kotlinx.coroutines.Dispatchers\n',
                  'import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.Dispatchers\n',
                  'coroutine import',
              )
          if 'import java.util.Date\n' not in text:
              text = replace_once(
                  text,
                  'import java.text.DateFormat\n',
                  'import java.text.DateFormat\nimport java.util.Date\n',
                  'date import',
              )
          old_widget_updates = (
              'suspend fun updateAllTabDeckWidgets(context: Context) {\n'
              '    TabDeckWidget().updateAll(context)\n'
              '    QuickCaptureWidget().updateAll(context)\n'
              '    TransferStatusWidget().updateAll(context)\n'
              '    DeckLauncherWidget().updateAll(context)\n'
              '}\n'
          )
          new_widget_updates = (
              'suspend fun updateAllTabDeckWidgets(context: Context) {\n'
              '    listOf(\n'
              '        TabDeckWidget(),\n'
              '        QuickCaptureWidget(),\n'
              '        TransferStatusWidget(),\n'
              '        DeckLauncherWidget(),\n'
              '    ).forEach { widget ->\n'
              '        try {\n'
              '            widget.updateAll(context)\n'
              '        } catch (cancelled: CancellationException) {\n'
              '            throw cancelled\n'
              '        } catch (_: Exception) {\n'
              '            // Widgets are derived UI. A launcher/rendering failure must not fail a completed data mutation.\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          text = replace_once(text, old_widget_updates, new_widget_updates, 'widget update block')
          text = replace_once(
              text,
              'private fun formatWidgetTime(epochMs: Long): String = DateFormat.getDateTimeInstance(DateFormat.SHORT, DateFormat.SHORT).format(epochMs)',
              'internal fun formatWidgetTime(epochMs: Long): String = DateFormat.getDateTimeInstance(DateFormat.SHORT, DateFormat.SHORT).format(Date(epochMs))',
              'widget time formatter',
          )
          widget.write_text(text, encoding='utf-8')

          repository = Path('app/src/main/java/com/tabdeck/app/data/TabDeckRepository.kt')
          text = repository.read_text(encoding='utf-8')
          old_mutation = (
              '        val awakened = tabs.wakeDueTabs(completedAt)\n'
              '        val pruned = tabs.pruneTrash(MaintenancePolicy.pruneBeforeEpochMs(completedAt, retentionDays))\n'
          )
          new_mutation = (
              '        val (awakened, pruned) = database.withTransaction {\n'
              '            val awakened = tabs.wakeDueTabs(completedAt)\n'
              '            val pruned = tabs.pruneTrash(MaintenancePolicy.pruneBeforeEpochMs(completedAt, retentionDays))\n'
              '            awakened to pruned\n'
              '        }\n'
          )
          text = replace_once(text, old_mutation, new_mutation, 'maintenance mutation block')
          text = replace_once(
              text,
              '        if (awakened > 0 || pruned > 0) refreshWidgets()\n',
              '        refreshWidgets()\n',
              'maintenance refresh block',
          )
          repository.write_text(text, encoding='utf-8')

          test = Path('app/src/test/java/com/tabdeck/app/widget/TabDeckWidgetFormattingTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(
              'package com.tabdeck.app.widget\n\n'
              'import org.junit.Assert.assertTrue\n'
              'import org.junit.Test\n\n'
              'class TabDeckWidgetFormattingTest {\n'
              '    @Test\n'
              '    fun epochTimestampFormatsAsDate() {\n'
              '        assertTrue(formatWidgetTime(0L).isNotBlank())\n'
              '    }\n'
              '}\n',
              encoding='utf-8',
          )

          validator = Path('tools/validate_project.py')
          text = validator.read_text(encoding='utf-8')
          needle = '        "maintenance policy core coverage": "MaintenancePolicy.kt" in (ROOT / "tools/run_core_checks.sh").read_text(encoding="utf-8"),\n'
          addition = (
              needle
              + '        "maintenance transaction and status refresh": "database.withTransaction" in repository and "settingsStore.recordMaintenance(status)\\n        refreshWidgets()" in repository,\n'
              + '        "failure-isolated widget refresh": "catch (_: Exception)" in (ROOT / "app/src/main/java/com/tabdeck/app/widget/TabDeckWidget.kt").read_text(encoding="utf-8"),\n'
              + '        "widget timestamp date conversion": "format(Date(epochMs))" in (ROOT / "app/src/main/java/com/tabdeck/app/widget/TabDeckWidget.kt").read_text(encoding="utf-8"),\n'
          )
          text = replace_once(text, needle, addition, 'validator anchor')
          validator.write_text(text, encoding='utf-8')
          PY

      - name: Verify committed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/check_version.py
          bash tools/run_core_checks.sh
          python3 tools/validate_project.py --report build-validation-report.txt
          python3 tools/validate_guided_utility.py
          python3 tools/validate_simple_release.py
          python3 tools/validate_connector_dom.py
          python3 tools/performance_budget.py --validate-config
          ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Commit verified hardening changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/tabdeck/app/data/TabDeckRepository.kt \
            app/src/main/java/com/tabdeck/app/widget/TabDeckWidget.kt \
            app/src/test/java/com/tabdeck/app/widget/TabDeckWidgetFormattingTest.kt \
            tools/validate_project.py \
            build-validation-report.txt
          test -n "$(git diff --cached --name-only)"
          git commit -m "Harden maintenance and widget runtime behavior"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:codex/automation-recovery-v1.2
