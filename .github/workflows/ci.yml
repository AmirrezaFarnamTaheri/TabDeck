name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  install-and-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/deep-improvement-plan'
    name: Install and verify complete implementation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: codex/deep-improvement-plan
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Prove pre-implementation gaps
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/java/com/tabdeck/app/data/BackupInputClassifier.kt
          test ! -f app/src/main/java/com/tabdeck/app/engine/SourceIdentity.kt
          ! grep -q 'sealed interface DecodeResult' app/src/main/java/com/tabdeck/app/data/SnapshotJsonCodec.kt
          ! grep -q 'sourceSessionId' app/src/main/java/com/tabdeck/app/bridge/BridgePayloadParser.kt

      - name: Reconstruct checksum-bound implementation payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .tabdeck-implementation -maxdepth 1 -name 'patch-*.b64' -type f | wc -l)" -eq 6
          cat .tabdeck-implementation/patch-*.b64 | base64 --decode > "${RUNNER_TEMP}/tabdeck-complete.patch.gz"
          echo "301e6687d39ffb9f415d31ab1ab336f8c24163cc2c0fa132737ef76998495d1a  ${RUNNER_TEMP}/tabdeck-complete.patch.gz" | sha256sum -c -
          gzip -dc "${RUNNER_TEMP}/tabdeck-complete.patch.gz" > "${RUNNER_TEMP}/tabdeck-complete.patch"
          test -s "${RUNNER_TEMP}/tabdeck-complete.patch"

          python3 - <<'PY'
          import os
          from pathlib import Path

          patch_path = Path(os.environ["RUNNER_TEMP"]) / "tabdeck-complete.patch"
          text = patch_path.read_text(encoding="utf-8")
          marker = "diff --git a/tools/validate_project.py b/tools/validate_project.py\n"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("validate_project.py patch section was not found")
          next_section = text.find("\ndiff --git ", start + len(marker))
          if next_section < 0:
              text = text[:start]
          else:
              text = text[:start] + text[next_section + 1:]
          patch_path.write_text(text, encoding="utf-8")
          PY

      - name: Apply implementation atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            README.md \
            docs/DEEP_IMPROVEMENT_PLAN.md \
            app/src/main/java/com/tabdeck/app/bridge/BridgePayloadParser.kt \
            app/src/main/java/com/tabdeck/app/engine/SourceIdentity.kt \
            app/src/test/java/com/tabdeck/app/engine/SourceIdentityTest.kt \
            extensions/chromium-desktop/popup.js \
            extensions/firefox-android/popup.js \
            tools/CoreChecks.kt \
            tools/run_core_checks.sh \
            docs/ARCHITECTURE.md \
            docs/BRIDGE_PROTOCOL.md
          git apply --check "${RUNNER_TEMP}/tabdeck-complete.patch"
          git apply "${RUNNER_TEMP}/tabdeck-complete.patch"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_project.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"validator replacement expected once, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '    export_codec = (ROOT / "app/src/main/java/com/tabdeck/app/data/TabExportCodec.kt").read_text(encoding="utf-8")\n',
              '    export_codec = (ROOT / "app/src/main/java/com/tabdeck/app/data/TabExportCodec.kt").read_text(encoding="utf-8")\n'
              '    snapshot_codec = (ROOT / "app/src/main/java/com/tabdeck/app/data/SnapshotJsonCodec.kt").read_text(encoding="utf-8")\n'
              '    bridge_network = (ROOT / "app/src/main/java/com/tabdeck/app/bridge/BridgeNetwork.kt").read_text(encoding="utf-8")\n',
          )
          replace_once(
              '        "UTF-8 bounded share import": "fun utf8Prefix" in view_model and "MAX_IMPORT_DOCUMENT_BYTES" in view_model,\n',
              '        "UTF-8 bounded share import": "fun utf8Prefix" in view_model and "MAX_IMPORT_DOCUMENT_BYTES" in view_model,\n'
              '        "typed backup classification": "sealed interface DecodeResult" in snapshot_codec and "decodeClassified" in view_model,\n'
              '        "loopback-only bridge": "LOOPBACK_ENDPOINT" in bridge_network and "0.0.0.0" not in bridge,\n'
              '        "session-scoped source identity": "SourceIdentity.encodeTabId" in (ROOT / "app/src/main/java/com/tabdeck/app/bridge/BridgePayloadParser.kt").read_text(encoding="utf-8"),\n',
          )
          replace_once(
              '        if "testBridgeConnection" not in popup or "\'/health\'" not in popup:\n'
              '            fail(f"Extension bridge preflight is missing in {folder.relative_to(ROOT)}")\n'
              '    ok("Validated TabDeck v1 product, compatibility, bridge, paging, export, bulk-control, and widget contracts")\n',
              '        if "testBridgeConnection" not in popup or "\'/health\'" not in popup:\n'
              '            fail(f"Extension bridge preflight is missing in {folder.relative_to(ROOT)}")\n'
              '        if "sourceSessionId" not in popup or "getSourceSession" not in popup:\n'
              '            fail(f"Extension session-scoped tab identity is missing in {folder.relative_to(ROOT)}")\n'
              '    parser = (ROOT / "app/src/main/java/com/tabdeck/app/bridge/BridgePayloadParser.kt").read_text(encoding="utf-8")\n'
              '    identity = (ROOT / "app/src/main/java/com/tabdeck/app/engine/SourceIdentity.kt").read_text(encoding="utf-8")\n'
              '    if "SourceIdentity.encodeTabId" not in parser or "sourceSessionId" not in parser:\n'
              '        fail("Bridge parser is missing session-scoped source identity")\n'
              '    if "sid1:" not in identity or "isSessionScoped" not in identity:\n'
              '        fail("Source identity codec contract is incomplete")\n'
              '    for required_file in (\n'
              '        ROOT / "tools/performance_budget.py",\n'
              '        ROOT / "tools/performance-budgets.json",\n'
              '        ROOT / "desktop-link/Test-TabDeckLink.ps1",\n'
              '        ROOT / "docs/adr/0001-durable-source-identity.md",\n'
              '        ROOT / "docs/adr/0002-loopback-bridge-trust-boundary.md",\n'
              '        ROOT / "docs/adr/0003-release-provenance.md",\n'
              '    ):\n'
              '        if not required_file.is_file():\n'
              '            fail(f"Missing verification contract: {required_file.relative_to(ROOT)}")\n'
              '    ok("Validated TabDeck v1 product, compatibility, bridge, paging, export, bulk-control, widget, and source-identity contracts")\n',
          )
          replace_once(
              '        "gh release create",\n'
              '    ):\n',
              '        "gh release create",\n'
              '        "environment: release",\n'
              '        "artifact-metadata: write",\n'
              '        "TABDECK_RELEASE_CERT_SHA256",\n'
              '        "git rev-list -n 1",\n'
              '        "keytool -printcert -jarfile",\n'
              '        "--source-commit",\n'
              '        "--signing-cert-sha256",\n'
              '    ):\n',
          )
          replace_once(
              '        if token not in release:\n'
              '            fail(f"Release workflow contract missing: {token}")\n'
              '    ok("Validated CI and signed-release workflow contracts")\n',
              '        if token not in release:\n'
              '            fail(f"Release workflow contract missing: {token}")\n'
              '    packager = (ROOT / "tools/package_release.py").read_text(encoding="utf-8")\n'
              '    for token in (\'"schemaVersion": 2\', \'"sourceCommit"\', \'"releaseTag"\', \'"signingCertificateSha256"\'):\n'
              '        if token not in packager:\n'
              '            fail(f"Release manifest provenance contract missing: {token}")\n'
              '    ok("Validated CI and signed-release workflow contracts")\n',
          )
          path.write_text(text, encoding="utf-8")
          PY

          chmod +x tools/package_release.py tools/performance_budget.py tools/run_core_checks.sh tools/validate_project.py
          rm -rf .tabdeck-implementation
          git diff --check

      - name: Verify synchronized versions and executable contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          python3 tools/check_version.py
          bash tools/run_core_checks.sh
          python3 tools/performance_budget.py --validate-config
          python3 tools/validate_project.py --report build-validation-report.txt
          node --check extensions/chromium-desktop/popup.js
          node --check extensions/firefox-android/popup.js

      - name: Validate Windows Desktop Link contracts
        shell: pwsh
        run: ./desktop-link/Test-TabDeckLink.ps1

      - name: Test, lint, and assemble Android app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f build-validation-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Implement TabDeck reliability, trust, and release contracts"
          git push origin HEAD:codex/deep-improvement-plan

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TabDeck-complete-implementation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**
            build-validation-report.txt
