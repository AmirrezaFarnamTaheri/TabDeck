name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  COMMUNITY_KEY_ALIAS: tabdeck-community
  COMMUNITY_KEY_PASSWORD: tabdeck-community
  COMMUNITY_CERT_SHA256: 8265D1219753753DC36635BAAEAB887FE63742C93CD686A498E5B66683A704A7

jobs:
  verify:
    name: Verify and build community APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify committed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Check synchronized versions
        run: python3 tools/check_version.py

      - name: Run executable core checks
        run: bash tools/run_core_checks.sh

      - name: Run static project validation
        run: python3 tools/validate_project.py --report build-validation-report.txt

      - name: Validate secretless release and branding
        run: python3 tools/validate_simple_release.py

      - name: Validate connector DOM contracts
        run: python3 tools/validate_connector_dom.py

      - name: Validate performance budgets
        run: python3 tools/performance_budget.py --validate-config

      - name: Validate Windows Desktop Link contracts
        shell: pwsh
        run: ./desktop-link/Test-TabDeckLink.ps1

      - name: Materialize public community signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/tabdeck-community.jks"
          base64 --decode release/tabdeck-community.jks.base64 > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          CERT_SHA256="$(keytool -list -v \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${COMMUNITY_KEY_PASSWORD}" \
            -alias "${COMMUNITY_KEY_ALIAS}" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          test "${CERT_SHA256}" = "${COMMUNITY_CERT_SHA256}"
          {
            echo "TABDECK_KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "TABDECK_KEYSTORE_PASSWORD=${COMMUNITY_KEY_PASSWORD}"
            echo "TABDECK_KEY_ALIAS=${COMMUNITY_KEY_ALIAS}"
            echo "TABDECK_KEY_PASSWORD=${COMMUNITY_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Test, lint, and assemble debug and release APKs
        run: ./gradlew --no-daemon --stacktrace clean test lintDebug assembleDebug lintRelease assembleRelease

      - name: Verify community release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          test -s "${APK}"
          test -x "${APKSIGNER}"
          "${ZIPALIGN}" -c -v 4 "${APK}"
          APK_CERT="$(${APKSIGNER} verify --verbose --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest:/{gsub(":", "", $2); print toupper($2); exit}')"
          test "${APK_CERT}" = "${COMMUNITY_CERT_SHA256}"

      - name: Package deterministic APK, source, connectors, and branding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_release.py \
            --require-apk \
            --output-dir dist \
            --source-commit "${GITHUB_SHA}" \
            --signing-cert-sha256 "${COMMUNITY_CERT_SHA256}"
          cd dist
          sha256sum -c TabDeck-v*-SHA256.txt

      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TabDeck-CI-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**
            build-validation-report.txt
            dist/*

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/tabdeck-community.jks"
