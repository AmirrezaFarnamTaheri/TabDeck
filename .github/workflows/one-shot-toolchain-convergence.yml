name: One-shot Android toolchain convergence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-toolchain-convergence.yml

permissions:
  contents: write
  actions: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" platform-tools "platforms;android-36" "build-tools;36.0.0"

      - name: Apply coherent toolchain and source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text and new not in text:
                  raise SystemExit(f"Neither old nor new token found in {path}: {old[:100]}")
              if old in text:
                  text = text.replace(old, new, count)
                  p.write_text(text, encoding="utf-8")

          def remove(path: str, token: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if token in text:
                  p.write_text(text.replace(token, ""), encoding="utf-8")

          # Coherent, stable build-tool updates represented by the open Dependabot PRs.
          replace("build.gradle.kts", 'version "9.0.1"', 'version "9.3.1"')
          replace("build.gradle.kts", 'version "2.2.10"', 'version "2.4.10"')
          replace("build.gradle.kts", 'version "2.3.9"', 'version "2.3.10"')
          replace("app/build.gradle.kts", "compose-bom:2026.06.00", "compose-bom:2026.06.01")

          # Keep the stable API-36 platform available on hosted runners.
          replace("app/build.gradle.kts", "androidx.core:core-ktx:1.19.0", "androidx.core:core-ktx:1.18.0")
          replace("app/build.gradle.kts", "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0", "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")
          replace("app/build.gradle.kts", "androidx.lifecycle:lifecycle-runtime-compose:2.11.0", "androidx.lifecycle:lifecycle-runtime-compose:2.10.0")
          replace("app/build.gradle.kts", "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0", "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")

          app = Path("app/build.gradle.kts")
          app_text = app.read_text(encoding="utf-8")
          room_anchor = '    implementation("androidx.room:room-ktx:$roomVersion")\n'
          room_paging = '    implementation("androidx.room:room-paging:$roomVersion")\n'
          if room_paging not in app_text:
              if room_anchor not in app_text:
                  raise SystemExit("Room dependency insertion anchor not found")
              app_text = app_text.replace(room_anchor, room_anchor + room_paging, 1)
          app.write_text(app_text, encoding="utf-8")

          # Suspend-safe, deterministic bulk lookup.
          replace(
              "app/src/main/java/com/tabdeck/app/data/TabDeckRepository.kt",
              '''        return ids.asSequence().distinct().chunked(SQLITE_IN_CHUNK)\n            .flatMap { tabs.findByIds(it).asSequence() }\n            .map { it.toModel() }\n            .toList()''',
              '''        val result = mutableListOf<TabItem>()\n        for (chunk in ids.asSequence().distinct().chunked(SQLITE_IN_CHUNK)) {\n            result += tabs.findByIds(chunk).map { it.toModel() }\n        }\n        return result''',
          )

          # Kotlin 2.4 no longer accepts collection-valued += here as mutable plusAssign.
          query_path = Path("app/src/main/java/com/tabdeck/app/data/local/TabQueryBuilder.kt")
          query_text = query_path.read_text(encoding="utf-8")
          query_replacements = {
              "args += query.statuses.map { it.name }": "args.addAll(query.statuses.map { it.name })",
              "args += query.browsers.map { it.name }": "args.addAll(query.browsers.map { it.name })",
              "args += query.groups.sorted()": "args.addAll(query.groups.sorted())",
              "args += query.sourceDevices.sorted()": "args.addAll(query.sourceDevices.sorted())",
              "args += query.sourceGroups.sorted()": "args.addAll(query.sourceGroups.sorted())",
          }
          for old, new in query_replacements.items():
              if old not in query_text and new not in query_text:
                  raise SystemExit(f"TabQueryBuilder token missing: {old}")
              query_text = query_text.replace(old, new)
          query_path.write_text(query_text, encoding="utf-8")

          # RE2/J has CASE_INSENSITIVE but not java.util.regex.Pattern.UNICODE_CASE.
          regex_path = "app/src/main/java/com/tabdeck/app/engine/RegexCategorizer.kt"
          replace(regex_path, "Pattern.CASE_INSENSITIVE or Pattern.UNICODE_CASE", "Pattern.CASE_INSENSITIVE")
          replace(
              regex_path,
              "fun categorize(tab: TabItem, rules: List<RegexRule>): TabItem = categorize(tab, compileEnabled(rules))",
              "fun categorize(tab: TabItem, rules: List<RegexRule>): TabItem = categorizeCompiled(tab, compileEnabled(rules))",
          )
          replace(
              regex_path,
              "fun categorize(tab: TabItem, rules: List<CompiledRule>): TabItem {",
              "internal fun categorizeCompiled(tab: TabItem, rules: List<CompiledRule>): TabItem {",
          )
          replace(
              regex_path,
              "return tabs.map { categorize(it, compiled) }",
              "return tabs.map { categorizeCompiled(it, compiled) }",
          )
          replace(
              "app/src/main/java/com/tabdeck/app/data/TabDeckRepository.kt",
              "RegexCategorizer.categorize(base, compiledRules)",
              "RegexCategorizer.categorizeCompiled(base, compiledRules)",
          )

          # Weight is a RowScope/ColumnScope member extension; explicit imports resolve to internal metadata.
          for source in (
              "app/src/main/java/com/tabdeck/app/ui/Components.kt",
              "app/src/main/java/com/tabdeck/app/ui/Dialogs.kt",
              "app/src/main/java/com/tabdeck/app/ui/Screens.kt",
              "app/src/main/java/com/tabdeck/app/ui/TabDeckRoot.kt",
          ):
              remove(source, "import androidx.compose.foundation.layout.weight\n")

          # Correct saveable package and transfer progress property.
          replace(
              "app/src/main/java/com/tabdeck/app/ui/Screens.kt",
              "import androidx.compose.runtime.rememberSaveable",
              "import androidx.compose.runtime.saveable.rememberSaveable",
          )
          replace("app/src/main/java/com/tabdeck/app/ui/Screens.kt", "progress.completed", "progress.processed")

          # Preserve both trailing-lambda and positional callback SwitchLine call styles.
          dialogs_path = Path("app/src/main/java/com/tabdeck/app/ui/Dialogs.kt")
          dialogs_text = dialogs_path.read_text(encoding="utf-8")
          old_signature = "fun SwitchLine(label: String, checked: Boolean, onChecked: (Boolean) -> Unit, supporting: String? = null)"
          primary_signature = "fun SwitchLine(label: String, checked: Boolean, supporting: String? = null, onChecked: (Boolean) -> Unit)"
          if old_signature in dialogs_text:
              dialogs_text = dialogs_text.replace(old_signature, primary_signature, 1)
          elif primary_signature not in dialogs_text:
              raise SystemExit("SwitchLine primary signature was not found")
          compatibility_overload = '''@Composable\nfun SwitchLine(\n    label: String,\n    checked: Boolean,\n    onChecked: (Boolean) -> Unit,\n    supporting: String? = null,\n) {\n    SwitchLine(label, checked, supporting, onChecked)\n}\n\n'''
          primary_marker = "@Composable\n" + primary_signature
          if compatibility_overload not in dialogs_text:
              if primary_marker not in dialogs_text:
                  raise SystemExit("SwitchLine overload insertion marker was not found")
              dialogs_text = dialogs_text.replace(primary_marker, compatibility_overload + primary_marker, 1)
          dialogs_path.write_text(dialogs_text, encoding="utf-8")

          # GlanceTheme is part of the base androidx.glance package; defaultWeight is a RowScope member extension.
          widget_path = "app/src/main/java/com/tabdeck/app/widget/TabDeckWidget.kt"
          replace(widget_path, "import androidx.glance.material3.GlanceTheme", "import androidx.glance.GlanceTheme")
          remove(widget_path, "import androidx.glance.layout.defaultWeight\n")

          # Keep the static release contract synchronized with the tested coordinates.
          validator = Path("tools/validate_project.py")
          text = validator.read_text(encoding="utf-8")
          replacements = {
              '"AGP 9.0.1": \'com.android.application") version "9.0.1"\'': '"AGP 9.3.1": \'com.android.application") version "9.3.1"\'',
              '"Kotlin 2.2.10": \'org.jetbrains.kotlin.plugin.compose") version "2.2.10"\'': '"Kotlin 2.4.10": \'org.jetbrains.kotlin.plugin.compose") version "2.4.10"\'',
              '"KSP 2.3.9": \'com.google.devtools.ksp") version "2.3.9"\'': '"KSP 2.3.10": \'com.google.devtools.ksp") version "2.3.10"\'',
              '"Compose BOM 2026.06.00": \'compose-bom:2026.06.00\'': '"Compose BOM 2026.06.01": \'compose-bom:2026.06.01\'',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f"Validator coordinate token not found: {old}")
              text = text.replace(old, new)
          room_validation_anchor = '        "Room 2.8.4": \'val roomVersion = "2.8.4"\',\n'
          room_validation = '        "Room Paging 2.8.4": \'androidx.room:room-paging:$roomVersion\',\n'
          if room_validation not in text:
              if room_validation_anchor not in text:
                  raise SystemExit("Validator Room insertion anchor not found")
              text = text.replace(room_validation_anchor, room_validation_anchor + room_validation, 1)
          validator.write_text(text, encoding="utf-8")

          Path(".github/workflows/one-shot-toolchain-convergence.yml").unlink()
          PY

      - name: Validate and build converged source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          python3 tools/check_version.py
          bash tools/run_core_checks.sh
          python3 tools/validate_project.py --report build-validation-report.txt
          ./gradlew --no-daemon --stacktrace test lintDebug assembleDebug

      - name: Commit verified convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converge Android toolchain and repair Kotlin build"
          git push origin HEAD:main

      - name: Dispatch clean CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TabDeck-toolchain-convergence-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-validation-report.txt
            app/build/reports/**
            app/build/test-results/**
