name: One-shot convergence adjustment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-convergence-adjustment.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Make compiled-rule helper module-visible and update its caller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-toolchain-convergence.yml')
          text = path.read_text(encoding='utf-8')
          old_visibility = '"private fun categorizeCompiled(tab: TabItem, rules: List<CompiledRule>): TabItem {"'
          new_visibility = '"internal fun categorizeCompiled(tab: TabItem, rules: List<CompiledRule>): TabItem {"'
          if old_visibility not in text and new_visibility not in text:
              raise SystemExit('Compiled helper visibility token not found')
          text = text.replace(old_visibility, new_visibility, 1)

          anchor = '''          replace(\n              regex_path,\n              "return tabs.map { categorize(it, compiled) }",\n              "return tabs.map { categorizeCompiled(it, compiled) }",\n          )\n'''
          caller_patch = '''          replace(\n              "app/src/main/java/com/tabdeck/app/data/TabDeckRepository.kt",\n              "RegexCategorizer.categorize(base, compiledRules)",\n              "RegexCategorizer.categorizeCompiled(base, compiledRules)",\n          )\n'''
          if caller_patch not in text:
              if anchor not in text:
                  raise SystemExit('Compiled helper caller insertion anchor not found')
              text = text.replace(anchor, anchor + caller_patch, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-convergence-adjustment.yml').unlink()
          PY

      - name: Commit workflow adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose compiled regex categorization helper"
          git push origin HEAD:main
